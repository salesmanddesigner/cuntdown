<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Cuntdown</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e1e1e">

<!-- iOS: abrir em tela cheia, sem barra do Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuntdown">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f3;
    --ink: #1e1e1e;
    --detail: #ebebeb;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); }

  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: calc(30px + env(safe-area-inset-top)) 20px 110px;
    position: relative;
    overflow-x: hidden;
  }

  header { margin-bottom: 26px; }

  .today {
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 0.01em;
    font-weight: 500;
  }

  h1 {
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .header-icon {
    width: 88px;
    height: 88px;
    object-fit: contain;
    display: block;
    margin: 0 auto 14px;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .filter-field { flex: 1; min-width: 0; }
  .filter-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    opacity: 0.55;
    margin: 0 0 4px 2px;
  }
  .filter-bar select {
    width: 100%;
    background: var(--detail);
    border: 1.5px solid var(--detail);
    border-radius: 12px;
    padding: 10px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    font-family: inherit;
  }
  .filter-bar select:focus { outline: none; border-color: var(--ink); }

  .section-label {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink);
    margin: 24px 2px 10px;
  }

  .counters {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    display: flex;
    align-items: stretch;
    background: var(--detail);
    border: none;
    border-radius: 18px;
    overflow: hidden;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }

  .card-main {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
    padding: 16px 16px;
  }

  .icon-badge {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }

  .card-text { min-width: 0; }

  .card-title {
    font-size: 15px;
    color: var(--ink);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .count-detail {
    font-size: 12px;
    color: var(--ink);
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-stat {
    flex-shrink: 0;
    width: 90px;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 6px;
  }

  .count-number {
    display: block;
    font-weight: 800;
    font-size: 26px;
    line-height: 1;
    color: var(--bg);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .count-unit {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--detail);
    margin-top: 3px;
  }

  .login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .login-screen.is-open { display: flex; }
  .login-box {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-title {
    font-weight: 800;
    font-size: 38px;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .login-sub {
    font-size: 14px;
    color: var(--ink);
    opacity: 0.65;
    line-height: 1.5;
    margin-bottom: 26px;
  }
  .google-signin-slot {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }
  .login-error {
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink);
    opacity: 0.7;
    min-height: 16px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
    position: relative;
  }
  .avatar-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: var(--detail);
    flex-shrink: 0;
    cursor: pointer;
    overflow: hidden;
  }
  .avatar-btn img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .profile-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
  }
  .profile-overlay.is-open { pointer-events: auto; }
  .profile-backdrop {
    position: absolute;
    inset: 0;
    background: var(--ink);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .profile-overlay.is-open .profile-backdrop { opacity: 0.35; }
  .profile-panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(78vw, 300px);
    background: var(--bg);
    border-radius: 26px 0 0 26px;
    padding: calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));
    transform: translateX(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .profile-overlay.is-open .profile-panel { transform: translateX(0); }
  .profile-photo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--detail);
  }
  .profile-name {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .profile-logout-btn {
    margin-top: auto;
    width: 100%;
    background: var(--detail);
    color: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 13px 0;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink);
  }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-state .empty-icon { width: 88px; height: 88px; object-fit: contain; margin-bottom: 14px; }
  .empty-state p { font-size: 14.5px; line-height: 1.5; }

  .top-fade {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: calc(env(safe-area-inset-top) + 30px);
    background: linear-gradient(to bottom, rgba(246, 245, 243, 1) 0%, rgba(246, 245, 243, 1) 60%, rgba(246, 245, 243, 0) 100%);
    pointer-events: none;
    z-index: 4;
  }

  .bottom-fade {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 130px;
    background: linear-gradient(to bottom, rgba(246, 245, 243, 0) 0%, rgba(246, 245, 243, 1) 65%);
    pointer-events: none;
    z-index: 4;
  }

  .add-button {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 390px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    padding: 15px 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 5;
    cursor: pointer;
  }

  /* ---------- Modal (novo / editar) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 30, 30, 0.35);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }
  .overlay.is-open { opacity: 1; pointer-events: auto; }

  .sheet {
    width: 100%;
    max-width: 430px;
    background: var(--bg);
    border-radius: 26px 26px 0 0;
    padding: 22px 22px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }
  .overlay.is-open .sheet { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--detail);
    border-radius: 2px;
    margin: 0 auto 18px;
  }

  .sheet-title {
    font-weight: 800;
    font-size: 21px;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
    color: var(--ink);
  }

  .detail-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .detail-icon {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    background: var(--detail);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .detail-icon img { width: 28px; height: 28px; object-fit: contain; }
  .detail-title {
    font-weight: 800;
    font-size: 19px;
    color: var(--ink);
  }
  .detail-sub {
    font-size: 13px;
    color: var(--ink);
    opacity: 0.6;
    margin-top: 2px;
  }
  .detail-stat {
    background: var(--ink);
    border-radius: 16px;
    padding: 16px 20px;
    text-align: center;
    margin-bottom: 10px;
  }
  .detail-number {
    display: inline;
    font-weight: 800;
    font-size: 22px;
    color: var(--bg);
  }
  .detail-unit {
    display: inline;
    font-size: 22px;
    font-weight: 800;
    color: var(--bg);
    margin-left: 6px;
  }
  .detail-date {
    text-align: center;
    font-size: 13px;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 22px;
  }
  .detail-info-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 6px;
  }
  .detail-info-text {
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.5;
    white-space: pre-wrap;
    background: var(--detail);
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 22px;
  }
  #detail-sheet .btn-save,
  #detail-sheet .btn-cancel {
    width: 100%;
    padding: 15px 0;
    border-radius: 999px;
    border: none;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--detail);
    border: 1.5px solid transparent;
    border-radius: 13px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--ink);
    background: var(--bg);
  }

  .calendar {
    background: var(--detail);
    border-radius: 16px;
    padding: 14px;
  }
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .calendar-month {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    text-transform: capitalize;
  }
  .calendar-month-select {
    display: flex;
    gap: 6px;
  }
  .calendar-month-select select {
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--detail);
    border-radius: 9px;
    padding: 5px 6px;
    font-family: inherit;
    text-transform: capitalize;
  }
  .calendar-nav { display: flex; gap: 6px; }
  .calendar-nav button {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
    border: none;
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    opacity: 0.5;
    margin-bottom: 6px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .calendar-day {
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 50%;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
  }
  .calendar-day.is-empty { visibility: hidden; cursor: default; }
  .calendar-day.is-today { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .calendar-day.is-selected { background: var(--ink); color: var(--bg); }

  .icon-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .icon-picker button {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    border: 1.5px solid var(--detail);
    background: var(--bg);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-picker button.is-active {
    border-color: var(--ink);
    background: var(--detail);
  }
  .icon-img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    display: block;
  }

  .category-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .category-picker button {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--detail);
    background: var(--bg);
    font-size: 13.5px;
    color: var(--ink);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .category-picker button.is-active {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }
  .category-picker button.add-category {
    border-style: dashed;
    color: var(--ink);
  }
  .category-pill {
    display: flex !important;
    align-items: center;
    gap: 6px;
  }
  .category-delete {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--detail);
    color: var(--ink);
    font-size: 12px;
    line-height: 1;
  }
  .category-pill.is-active .category-delete {
    background: var(--bg);
    color: var(--ink);
  }

  .mode-toggle { display: flex; gap: 8px; }
  .mode-toggle button {
    flex: 1;
    padding: 10px 0;
    border-radius: 13px;
    border: 1.5px solid var(--detail);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .mode-toggle button.is-active {
    border-color: var(--ink);
    color: var(--bg);
    background: var(--ink);
  }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .sheet-actions button {
    flex: 1;
    padding: 13px 0;
    border-radius: 999px;
    border: none;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-cancel { background: var(--detail); color: var(--ink); }
  .btn-save { background: var(--ink); color: var(--bg); }
  .btn-delete {
    background: none;
    border: none;
    color: var(--ink);
    text-decoration: underline;
    width: 100%;
    margin-top: 10px;
    padding: 10px 0;
    cursor: pointer;
  }
</style>
</head>

<script type="module">
  const STORAGE_KEY = 'contador:counters';
  const CATEGORIES_KEY = 'contador:categories';
  const DEFAULT_CATEGORIES = ['Show', 'Aniversário', 'Viagem'];

  // ---------- Firebase (salvamento na nuvem) ----------

  import { getAuth, GoogleAuthProvider, signInWithCredential, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const GOOGLE_CLIENT_ID = "450514349028-dli21v0eoufkojsrc068mejp3b1j0ef1.apps.googleusercontent.com";

  const firebaseConfig = {
    apiKey: "AIzaSyDrDZ-Mmbif3isAmsAvyf_bXT1jY4v9kAc",
    authDomain: "amanda-5ca11.firebaseapp.com",
    projectId: "amanda-5ca11",
    storageBucket: "amanda-5ca11.firebasestorage.app",
    messagingSenderId: "450514349028",
    appId: "1:450514349028:web:b43bdde69cd8e54ca575f1",
  };

  let cloudReady = false;
  let cloudRef = null;
  let applyingRemote = false;
  let auth = null;

  function loadGsiScript() {
    return new Promise((resolve, reject) => {
      if (window.google && window.google.accounts) return resolve();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.defer = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('gsi script failed'));
      document.head.appendChild(s);
    });
  }

  try {
    const firebaseApp = initializeApp(firebaseConfig);
    auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    enableIndexedDbPersistence(db).catch(() => {});
    setPersistence(auth, browserLocalPersistence).catch((err) => console.error('Falha ao configurar persistência:', err));

    const loginScreen = document.getElementById('login-screen');
    const loginError = document.getElementById('login-error');
    const avatarBtn = document.getElementById('avatar-btn');
    const profileOverlay = document.getElementById('profile-overlay');

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        cloudReady = false;
        cloudRef = null;
        loginScreen.classList.add('is-open');
        avatarBtn.style.display = 'none';
        profileOverlay.classList.remove('is-open');
        return;
      }

      loginScreen.classList.remove('is-open');
      avatarBtn.style.display = 'block';
      document.getElementById('user-name').textContent = user.displayName || user.email || 'Conta conectada';
      document.getElementById('user-photo').src = user.photoURL || '';
      document.getElementById('profile-photo').src = user.photoURL || '';

      cloudRef = doc(db, 'contadores', user.uid);
      cloudReady = true;

      onSnapshot(cloudRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          applyingRemote = true;
          counters = data.counters || [];
          categories = (data.categories && data.categories.length) ? data.categories : [...DEFAULT_CATEGORIES];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(counters));
          localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
          selectedCategories = selectedCategories.filter(c => categories.includes(c));
          if (selectedCategories.length === 0 && categories.length) selectedCategories = [categories[0]];
          renderFilterCategoryOptions();
          renderList();
          applyingRemote = false;
        } else {
          syncToCloud();
        }
      });
    });

    loadGsiScript().then(() => {
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: (response) => {
          loginError.textContent = '';
          const credential = GoogleAuthProvider.credential(response.credential);
          signInWithCredential(auth, credential).catch((err) => {
            console.error('Falha ao entrar com Google:', err);
            loginError.textContent = 'Erro: ' + (err.code || err.message || 'desconhecido');
          });
        },
      });
      window.google.accounts.id.renderButton(document.getElementById('google-signin-button'), {
        type: 'standard',
        theme: 'filled_black',
        size: 'large',
        shape: 'pill',
        text: 'signin_with',
        logo_alignment: 'left',
        width: 300,
      });
    }).catch((err) => {
      console.error('Falha ao carregar o login do Google:', err);
      loginError.textContent = 'Não deu pra carregar o login do Google agora.';
    });

    document.getElementById('avatar-btn').addEventListener('click', () => {
      profileOverlay.classList.add('is-open');
    });
    profileOverlay.addEventListener('click', (e) => {
      if (e.target === profileOverlay || e.target.id === 'profile-backdrop') {
        profileOverlay.classList.remove('is-open');
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      profileOverlay.classList.remove('is-open');
      signOut(auth);
    });

    // Arrastar o painel de perfil pra fechar.
    (function setupProfilePanelSwipeToClose() {
      const panel = document.getElementById('profile-panel');
      let startX = 0;
      let currentX = 0;
      let dragging = false;

      panel.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        currentX = startX;
        dragging = true;
        panel.style.transition = 'none';
      }, { passive: true });

      panel.addEventListener('touchmove', (e) => {
        if (!dragging) return;
        currentX = e.touches[0].clientX;
        const delta = currentX - startX;
        if (delta > 0) panel.style.transform = `translateX(${delta}px)`;
      }, { passive: true });

      panel.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        const delta = currentX - startX;
        panel.style.transition = 'transform 0.25s ease';
        panel.style.transform = '';
        if (delta > 80) profileOverlay.classList.remove('is-open');
      });
    })();
  } catch (err) {
    console.error('Firebase indisponível, usando apenas armazenamento local:', err);
  }

  function syncToCloud() {
    if (!cloudReady || !cloudRef || applyingRemote) return;
    setDoc(cloudRef, { counters, categories }, { merge: false }).catch((err) => {
      console.error('Falha ao sincronizar com a nuvem:', err);
    });
  }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(counters));
    syncToCloud();
  }

  function loadCategories() {
    try {
      const raw = localStorage.getItem(CATEGORIES_KEY);
      const list = raw ? JSON.parse(raw) : null;
      return (list && list.length) ? list : [...DEFAULT_CATEGORIES];
    } catch (e) {
      return [...DEFAULT_CATEGORIES];
    }
  }

  function saveCategories() {
    localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
    syncToCloud();
  }

  function uid() {
    return 'c-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function parseLocalDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function todayAtMidnight() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function daysBetween(a, b) {
    return Math.round((b.getTime() - a.getTime()) / 86400000);
  }

  function formatLongDate(date) {
    return `${date.getDate()} de ${MESES[date.getMonth()]} de ${date.getFullYear()}`;
  }

  function renderTodayLabel() {
    document.getElementById('today-label').textContent = 'Hoje é ' + formatLongDate(todayAtMidnight());
  }

  function renderIconPicker() {
    const wrap = document.getElementById('icon-picker');
    wrap.innerHTML = '';
    ICONS.forEach(icon => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML = iconMarkup(icon);
      btn.className = icon === selectedIcon ? 'is-active' : '';
      btn.addEventListener('click', () => {
        selectedIcon = icon;
        renderIconPicker();
      });
      wrap.appendChild(btn);
    });
  }

  function renderModeToggle() {
    document.querySelectorAll('#mode-toggle button').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.mode === selectedMode);
    });
  }

  document.querySelectorAll('#mode-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMode = btn.dataset.mode;
      renderModeToggle();
    });
  });

  function renderUnitToggle() {
    document.querySelectorAll('#unit-toggle button').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.unit === selectedUnit);
    });
  }

  document.querySelectorAll('#unit-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedUnit = btn.dataset.unit;
      renderUnitToggle();
    });
  });

  function renderCategoryPicker() {
    const wrap = document.getElementById('category-picker');
    wrap.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'category-pill' + (selectedCategories.includes(cat) ? ' is-active' : '');

      const label = document.createElement('span');
      label.textContent = cat;
      btn.appendChild(label);

      const del = document.createElement('span');
      del.className = 'category-delete';
      del.textContent = '×';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (categories.length <= 1) {
          alert('Precisa ter pelo menos uma categoria.');
          return;
        }
        if (!confirm(`Excluir a categoria "${cat}"?`)) return;
        categories = categories.filter(c => c !== cat);
        saveCategories();
        selectedCategories = selectedCategories.filter(c => c !== cat);
        if (selectedCategories.length === 0 && categories.length) selectedCategories = [categories[0]];
        if (filterCategory === cat) filterCategory = 'all';
        renderCategoryPicker();
        renderFilterCategoryOptions();
        renderList();
      });
      btn.appendChild(del);

      btn.addEventListener('click', () => {
        if (selectedCategories.includes(cat)) {
          if (selectedCategories.length > 1) {
            selectedCategories = selectedCategories.filter(c => c !== cat);
          }
        } else {
          selectedCategories.push(cat);
        }
        renderCategoryPicker();
      });
      wrap.appendChild(btn);
    });
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-category';
    addBtn.textContent = '+ Nova';
    addBtn.addEventListener('click', () => {
      const name = prompt('Nome da nova categoria:');
      if (!name || !name.trim()) return;
      const clean = name.trim();
      if (!categories.includes(clean)) {
        categories.push(clean);
        saveCategories();
        renderFilterCategoryOptions();
      }
      if (!selectedCategories.includes(clean)) selectedCategories.push(clean);
      renderCategoryPicker();
    });
    wrap.appendChild(addBtn);
  }

  function renderRepeatPicker() {
    const wrap = document.getElementById('repeat-picker');
    wrap.innerHTML = '';
    REPEAT_OPTIONS.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = opt.label;
      btn.className = opt.key === selectedRepeat ? 'is-active' : '';
      btn.addEventListener('click', () => {
        selectedRepeat = opt.key;
        renderRepeatPicker();
      });
      wrap.appendChild(btn);
    });
  }

  let calViewYear = todayAtMidnight().getFullYear();
  let calViewMonth = todayAtMidnight().getMonth();
  const CAL_YEAR_MIN = todayAtMidnight().getFullYear() - 100;
  const CAL_YEAR_MAX = todayAtMidnight().getFullYear() + 15;

  function toISODate(date) {
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${m}-${d}`;
  }

  function setCalendarView(date) {
    calViewYear = date.getFullYear();
    calViewMonth = date.getMonth();
  }

  function populateCalendarSelects() {
    const monthSelect = document.getElementById('cal-month-select');
    const yearSelect = document.getElementById('cal-year-select');
    if (monthSelect.children.length === 0) {
      monthSelect.innerHTML = MESES_ABBR.map((m, i) => `<option value="${i}">${m}</option>`).join('');
    }
    if (yearSelect.children.length === 0) {
      let opts = '';
      for (let y = CAL_YEAR_MAX; y >= CAL_YEAR_MIN; y--) {
        opts += `<option value="${y}">${y}</option>`;
      }
      yearSelect.innerHTML = opts;
    }
  }

  function renderCalendar() {
    const grid = document.getElementById('cal-grid');
    const selectedIso = document.getElementById('f-date').value;
    const todayIso = toISODate(todayAtMidnight());

    populateCalendarSelects();
    document.getElementById('cal-month-select').value = String(calViewMonth);
    document.getElementById('cal-year-select').value = String(calViewYear);

    const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
    const offset = (firstOfMonth.getDay() + 6) % 7;
    const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();

    grid.innerHTML = '';
    for (let i = 0; i < offset; i++) {
      const empty = document.createElement('span');
      empty.className = 'calendar-day is-empty';
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dayDate = new Date(calViewYear, calViewMonth, d);
      const iso = toISODate(dayDate);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'calendar-day';
      if (iso === todayIso) btn.classList.add('is-today');
      if (iso === selectedIso) btn.classList.add('is-selected');
      btn.textContent = d;
      btn.addEventListener('click', () => {
        document.getElementById('f-date').value = iso;
        renderCalendar();
      });
      grid.appendChild(btn);
    }
  }

  document.getElementById('cal-month-select').addEventListener('change', (e) => {
    calViewMonth = Number(e.target.value);
    renderCalendar();
  });
  document.getElementById('cal-year-select').addEventListener('change', (e) => {
    calViewYear = Number(e.target.value);
    renderCalendar();
  });

  document.getElementById('cal-prev').addEventListener('click', () => {
    calViewMonth -= 1;
    if (calViewMonth < 0) { calViewMonth = 11; calViewYear -= 1; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    calViewMonth += 1;
    if (calViewMonth > 11) { calViewMonth = 0; calViewYear += 1; }
    renderCalendar();
  });

  function nextOccurrence(date, today, repeat) {
    const next = new Date(date);
    while (next < today) {
      if (repeat === 'weekly') next.setDate(next.getDate() + 7);
      else if (repeat === 'monthly') next.setMonth(next.getMonth() + 1);
      else if (repeat === 'yearly') next.setFullYear(next.getFullYear() + 1);
      else break;
    }
    return next;
  }

  function formatCount(days, unitPref, pastSuffix) {
    const suffix = pastSuffix ? ' atrás' : '';
    if (unitPref === 'anos') {
      const years = Math.floor(days / 365);
      return { number: years, unit: (years === 1 ? 'ano' : 'anos') + suffix };
    }
    return { number: days, unit: (days === 1 ? 'dia' : 'dias') + suffix };
  }

  function computeDisplay(counter) {
    const today = todayAtMidnight();
    let targetDate = parseLocalDate(counter.date);
    const repeat = counter.repeat || 'none';
    const unitPref = counter.unit || 'dias';
    let number, unit, detail, group, sortDays;

    if (counter.mode === 'desde') {
      const diff = Math.max(0, daysBetween(targetDate, today));
      ({ number, unit } = formatCount(diff, unitPref, false));
      detail = formatLongDate(targetDate);
      group = 'ongoing';
      sortDays = diff;
    } else {
      let diff = daysBetween(today, targetDate);
      if (diff < 0 && repeat !== 'none') {
        targetDate = nextOccurrence(targetDate, today, repeat);
        diff = daysBetween(today, targetDate);
      }
      if (diff > 0) {
        ({ number, unit } = formatCount(diff, unitPref, false));
        detail = formatLongDate(targetDate);
        group = 'upcoming';
        sortDays = diff;
      } else if (diff === 0) {
        number = '🎉';
        unit = 'é hoje!';
        detail = formatLongDate(targetDate);
        group = 'upcoming';
        sortDays = 0;
      } else {
        ({ number, unit } = formatCount(Math.abs(diff), unitPref, true));
        detail = formatLongDate(targetDate);
        group = 'past';
        sortDays = Math.abs(diff);
      }
    }

    return { number, unit, detail, group, sortDays };
  }

  function buildCard(counter) {
    const { number, unit, detail, group, sortDays } = computeDisplay(counter);

    const card = document.createElement('button');
    card.className = 'card';
    card.type = 'button';
    card.innerHTML = `
      <div class="card-main">
        <div class="icon-badge">${iconMarkup(counter.icon)}</div>
        <div class="card-text">
          <p class="card-title">${escapeHtml(counter.name)}</p>
          <p class="count-detail">${detail}</p>
        </div>
      </div>
      <div class="card-stat">
        <span class="count-number">${number}</span>
        <span class="count-unit">${unit}</span>
      </div>
    `;
    card.addEventListener('click', () => openDetail(counter.id));
    return { card, group, sortDays };
  }

    }

    const filtered = counters.filter(c =>
      (filterCategory === 'all' || getCategories(c).includes(filterCategory)) &&
      (filterMode === 'all' || c.mode === filterMode)
    );

    if (filtered.length === 0) {
      empty.innerHTML = `
        <div class="emoji">🔍</div>
        <p>Nenhum evento encontrado com esse filtro.</p>
      `;
      empty.style.display = 'block';
      upcomingLabel.style.display = 'none';
      ongoingSection.style.display = 'none';
      pastSection.style.display = 'none';
      return;
    }
    empty.style.display = 'none';

    const sorted = [...filtered].sort((a, b) => b.createdAt - a.createdAt);
    const built = sorted.map(counter => ({ counter, ...buildCard(counter) }));
    const upcomingBuilt = built.filter(b => b.group === 'upcoming').sort((a, b) => a.sortDays - b.sortDays);

    upcomingBuilt.forEach(({ card }) => list.appendChild(card));
    built.forEach(({ card, group }) => {
      if (group === 'ongoing') {
        ongoingList.appendChild(card);
      } else if (group === 'past') {
        pastList.appendChild(card);
      }
    });

    upcomingLabel.style.display = list.children.length > 0 ? 'block' : 'none';
    ongoingSection.style.display = ongoingList.children.length > 0 ? 'block' : 'none';
    pastSection.style.display = pastList.children.length > 0 ? 'block' : 'none';
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function openNew() {
    editingId = null;
    selectedIcon = ICONS[0];
    selectedMode = 'faltam';
    selectedUnit = 'dias';
    selectedCategories = categories.length ? [categories[0]] : [];
    selectedRepeat = 'none';
    document.getElementById('sheet-title').textContent = 'Novo evento';
    document.getElementById('f-name').value = '';
    document.getElementById('f-date').value = '';
    document.getElementById('f-info').value = '';
    document.getElementById('btn-delete').style.display = 'none';
    setCalendarView(todayAtMidnight());
    renderIconPicker();
    renderModeToggle();
    renderUnitToggle();
    renderCategoryPicker();
    renderRepeatPicker();
    renderCalendar();
    openOverlay();
    formSnapshot = captureFormSnapshot();
  }

  function openEdit(id) {
    const counter = counters.find(c => c.id === id);
    if (!counter) return;
    editingId = id;
    selectedIcon = counter.icon;
    selectedMode = counter.mode;
    selectedUnit = counter.unit || 'dias';
    selectedCategories = getCategories(counter).filter(c => categories.includes(c));
    if (selectedCategories.length === 0 && categories.length) selectedCategories = [categories[0]];
    selectedRepeat = counter.repeat || 'none';
    document.getElementById('sheet-title').textContent = 'Editar evento';
    document.getElementById('f-name').value = counter.name;
    document.getElementById('f-date').value = counter.date;
    document.getElementById('f-info').value = counter.info || '';
    document.getElementById('btn-delete').style.display = 'block';
    setCalendarView(parseLocalDate(counter.date));
    renderIconPicker();
    renderModeToggle();
    renderUnitToggle();
    renderCategoryPicker();
    renderRepeatPicker();
    renderCalendar();
    openOverlay();
    formSnapshot = captureFormSnapshot();
  }

  let formSnapshot = null;

  function captureFormSnapshot() {
    return JSON.stringify({
      name: document.getElementById('f-name').value,
      date: document.getElementById('f-date').value,
      info: document.getElementById('f-info').value,
      icon: selectedIcon,
      mode: selectedMode,
      unit: selectedUnit,
      categories: [...selectedCategories].sort(),
      repeat: selectedRepeat,
    });
  }

  function hasUnsavedChanges() {
    return formSnapshot !== null && formSnapshot !== captureFormSnapshot();
  }

  function closeOverlayWithConfirm() {
    if (hasUnsavedChanges() && !confirm('Descartar as alterações não salvas?')) return;
    closeOverlay();
  }

  function openOverlay() {
    document.getElementById('overlay').classList.add('is-open');
    document.querySelector('#overlay .sheet').scrollTop = 0;
  }
  function closeOverlay() {
    document.getElementById('overlay').classList.remove('is-open');
  }

  function openDetail(id) {
    const counter = counters.find(c => c.id === id);
    if (!counter) return;
    detailId = id;
    const { number, unit, detail, group } = computeDisplay(counter);
    const prefix = (group === 'upcoming' && number !== '🎉') ? 'em ' : '';
    document.getElementById('detail-icon').innerHTML = iconMarkup(counter.icon);
    document.getElementById('detail-name').textContent = counter.name;
    document.getElementById('detail-category').textContent = getCategories(counter).join(', ');
    document.getElementById('detail-number').textContent = prefix + number;
    document.getElementById('detail-unit').textContent = unit;
    document.getElementById('detail-date').textContent = detail;
    const infoBlock = document.getElementById('detail-info-block');
    if (counter.info && counter.info.trim()) {
      document.getElementById('detail-info-text').textContent = counter.info;
      infoBlock.style.display = 'block';
    } else {
      infoBlock.style.display = 'none';
    }
    document.getElementById('detail-overlay').classList.add('is-open');
    document.querySelector('#detail-overlay .sheet').scrollTop = 0;
  }
  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('is-open');
  }

  function escapeICS(str) {
    return String(str).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }

  function formatICSDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}${m}${d}`;
  }

  function downloadICS(counter) {
    const startDate = parseLocalDate(counter.date);
    const endDate = new Date(startDate);
    endDate.setDate(endDate.getDate() + 1);

    const repeatMap = { weekly: 'WEEKLY', monthly: 'MONTHLY', yearly: 'YEARLY' };
    const rrule = repeatMap[counter.repeat] ? `RRULE:FREQ=${repeatMap[counter.repeat]}\r\n` : '';
    const description = counter.info ? `DESCRIPTION:${escapeICS(counter.info)}\r\n` : '';

    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Cuntdown//PT-BR',
      'BEGIN:VEVENT',
      `UID:${counter.id}@cuntdown`,
      `DTSTAMP:${formatICSDate(todayAtMidnight())}T000000Z`,
      `DTSTART;VALUE=DATE:${formatICSDate(startDate)}`,
      `DTEND;VALUE=DATE:${formatICSDate(endDate)}`,
      `SUMMARY:${escapeICS(counter.name)}`,
      rrule.trim(),
      description.trim(),
      'END:VEVENT',
      'END:VCALENDAR',
    ].filter(Boolean).join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${counter.name.replace(/[^a-z0-9]+/gi, '-')}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // Arrastar a folha pra baixo pra fechar, como nos sheets nativos do iOS.
  function setupSheetSwipeToClose(sheetSelector, onClose) {
    const sheet = document.querySelector(sheetSelector);
    let startY = 0;
    let currentY = 0;
    let dragging = false;

    sheet.addEventListener('touchstart', (e) => {
      if (sheet.scrollTop > 0) { dragging = false; return; }
      startY = e.touches[0].clientY;
      currentY = startY;
      dragging = true;
      sheet.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      currentY = e.touches[0].clientY;
      const delta = currentY - startY;
      if (delta > 0) sheet.style.transform = `translateY(${delta}px)`;
    }, { passive: true });

    sheet.addEventListener('touchend', () => {
      if (!dragging) return;
      dragging = false;
      const delta = currentY - startY;
      sheet.style.transition = 'transform 0.25s ease';
      sheet.style.transform = '';
      if (delta > 120) onClose();
    });
  }
  setupSheetSwipeToClose('#overlay .sheet', closeOverlayWithConfirm);
  setupSheetSwipeToClose('#detail-overlay .sheet', closeDetail);

  document.getElementById('btn-open-new').addEventListener('click', openNew);
  document.getElementById('btn-cancel').addEventListener('click', closeOverlayWithConfirm);
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target.id === 'overlay') closeOverlayWithConfirm();
  });
  document.getElementById('detail-overlay').addEventListener('click', e => {
    if (e.target.id === 'detail-overlay') closeDetail();
  });
  document.getElementById('btn-detail-edit').addEventListener('click', () => {
    closeDetail();
    openEdit(detailId);
  });
  document.getElementById('btn-detail-calendar').addEventListener('click', () => {
    const counter = counters.find(c => c.id === detailId);
    if (counter) downloadICS(counter);
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    const date = document.getElementById('f-date').value;
    const info = document.getElementById('f-info').value.trim();
    if (!name || !date) {
      alert('Ei! Você esqueceu o nome e a data.');
      return;
    }

    if (editingId) {
      const counter = counters.find(c => c.id === editingId);
      counter.name = name;
      counter.date = date;
      counter.icon = selectedIcon;
      counter.mode = selectedMode;
      counter.unit = selectedUnit;
      counter.categories = [...selectedCategories];
      delete counter.category;
      counter.repeat = selectedRepeat;
      counter.info = info;
    } else {
      counters.push({
        id: uid(),
        name,
        date,
        icon: selectedIcon,
        mode: selectedMode,
        unit: selectedUnit,
        categories: [...selectedCategories],
        repeat: selectedRepeat,
        info,
        createdAt: Date.now(),
      });
    }
    saveCounters();
    renderList();
    closeOverlay();
  });

  document.getElementById('btn-delete').addEventListener('click', () => {
    if (!editingId) return;
    if (!confirm('Excluir este evento?')) return;
    counters = counters.filter(c => c.id !== editingId);
    saveCounters();
    renderList();
    closeOverlay();
  });

  renderTodayLabel();
  renderIconPicker();
  renderModeToggle();
  renderUnitToggle();
  renderCategoryPicker();
  renderRepeatPicker();
  renderFilterCategoryOptions();
  renderList();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.error('Falha ao registrar service worker:', err));
    });
  }
</script>
